<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>자재관리 시스템</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator_midnight.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 처음 열렸을 때 잠깐 보이는 화면. 로그인 여부를 확인하는 동안 표시됩니다.
         이게 없으면 로그인 화면이 깜빡 보였다가 앱 화면으로 바뀌어 어수선합니다. -->
    <div id="loading-view" class="center-screen">
        <p class="caption">불러오는 중...</p>
    </div>

    <!-- 로그인 화면 -->
    <div id="login-view" class="center-screen hidden">
        <div class="login-box">
            <h1>📦 자재관리 시스템</h1>
            <p class="caption">설비 자재 재고, 입출고 이력, 구매 요청을 한 곳에서 관리합니다.</p>

            <form id="login-form">
                <label for="email">이메일</label>
                <input type="email" id="email" autocomplete="username" required>

                <label for="password">비밀번호</label>
                <input type="password" id="password" autocomplete="current-password" required>

                <button type="submit" id="login-btn" style="margin-top:18px; width:100%">로그인</button>
            </form>

            <p class="error-msg hidden" id="login-error"></p>
        </div>
    </div>

    <!-- 로그인한 뒤 보이는 앱 화면 -->
    <div id="app-view" class="hidden">
        <header class="topbar">
            <div class="brand">📦 자재관리 시스템</div>
            <div class="user">
                <span id="user-email"></span>
                <span class="badge" id="user-role"></span>
                <button class="secondary" id="logout-btn">로그아웃</button>
            </div>
        </header>

        <div class="layout">
            <!-- 왼쪽 메뉴 -->
            <nav class="sidebar">
                <button class="nav-btn" data-page="boq">🔎 BOQ 검색</button>
                <button class="nav-btn" data-page="materials">📋 자재 목록</button>
            </nav>

            <main class="content">
                <!-- 요약 카드 -->
                <div class="metrics">
                    <div class="metric"><span class="metric-label">전체 자재</span><span class="metric-value" id="m-total">-</span></div>
                    <div class="metric"><span class="metric-label">카테고리</span><span class="metric-value" id="m-categories">-</span></div>
                    <div class="metric"><span class="metric-label">구매 필요</span><span class="metric-value" id="m-need">-</span></div>
                </div>
                <p class="warn-box hidden" id="need-warning"></p>

                <!-- ========== BOQ 검색 ========== -->
                <section class="page" id="page-boq">
                    <h1 class="page-title">🔎 BOQ 검색</h1>
                    <p class="caption">
                        PLC 그룹 없는 형태(예: LM101 BD001)와 포함된 형태(예: CC101 LM101 BD001)
                        둘 다 검색됩니다. 띄어쓰기와 대소문자는 무시합니다.
                    </p>

                    <div class="search-bar">
                        <input type="text" id="boq-input" placeholder="컨베이어 ID 입력 후 Enter" autocomplete="off">
                        <button id="boq-search-btn">조회</button>
                    </div>

                    <p class="caption hidden" id="boq-status"></p>

                    <div id="boq-result" class="two-col hidden">
                        <div class="card" id="boq-spec"></div>

                        <div class="card">
                            <div class="card-head">
                                <h2 style="margin:0">교체(사용) 이력 <span class="count" id="boq-history-count"></span></h2>
                                <div class="card-actions">
                                    <select id="boq-sort">
                                        <option value="desc">최신순</option>
                                        <option value="asc">과거순</option>
                                    </select>
                                    <button class="secondary" id="boq-excel-btn">엑셀</button>
                                </div>
                            </div>
                            <div id="boq-history-list"></div>
                        </div>
                    </div>
                </section>

                <!-- ========== 자재 목록 ========== -->
                <section class="page hidden" id="page-materials">
                    <div class="card-head">
                        <h1 class="page-title" style="margin:0">📋 자재 목록</h1>
                        <div class="card-actions">
                            <button class="secondary" id="materials-reload-btn">새로고침</button>
                            <button class="secondary" id="materials-excel-btn">엑셀</button>
                        </div>
                    </div>
                    <p class="caption" id="materials-count"></p>
                    <p class="caption hidden" id="materials-status"></p>
                    <div id="materials-table"></div>
                    <p class="caption">
                        컬럼 제목 아래 칸에 입력하면 걸러집니다. 엑셀은 화면에 보이는 결과 그대로 받습니다.
                        자재 수정/삭제는 아직 Streamlit 앱에서 하셔야 합니다.
                    </p>
                </section>
            </main>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
