<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>자재관리 시스템</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 처음 열렸을 때 잠깐 보이는 화면. 로그인 여부를 확인하는 동안 표시됩니다.
         이게 없으면 로그인 화면이 깜빡 보였다가 앱 화면으로 바뀌어 어수선합니다. -->
    <div id="loading-view" class="center-screen">
        <p class="caption">불러오는 중...</p>
    </div>

    <!-- 로그인 화면 -->
    <div id="login-view" class="center-screen hidden">
        <div class="login-box">
            <h1>📦 자재관리 시스템</h1>
            <p class="caption">설비 자재 재고, 입출고 이력, 구매 요청을 한 곳에서 관리합니다.</p>

            <form id="login-form">
                <label for="email">이메일</label>
                <input type="email" id="email" autocomplete="username" required>

                <label for="password">비밀번호</label>
                <input type="password" id="password" autocomplete="current-password" required>

                <button type="submit" id="login-btn" style="margin-top:18px; width:100%">로그인</button>
            </form>

            <p class="error-msg hidden" id="login-error"></p>
        </div>
    </div>

    <!-- 로그인한 뒤 보이는 앱 화면 -->
    <div id="app-view" class="hidden">
        <header class="topbar">
            <div class="brand">📦 자재관리 시스템</div>
            <div class="user">
                <span id="user-email"></span>
                <span class="badge" id="user-role"></span>
                <button class="secondary" id="logout-btn">로그아웃</button>
            </div>
        </header>

        <div class="container">
            <div class="card">
                <h2 style="margin-top:0">로그인 완료</h2>
                <p class="caption" style="margin-bottom:0">
                    화면을 하나씩 옮기는 중입니다. 다음은 <strong>BOQ 검색</strong>입니다.<br>
                    옮길 항목은 <code>web/PORTING.md</code>에 정리돼 있습니다.
                </p>
            </div>

            <p class="caption">
                기존 Streamlit 앱도 그대로 쓰실 수 있습니다.
            </p>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
